<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Postgres CDC Pipeline: Watermark, trigger and WAL change capture from PostgreSQL, scored against ground truth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#38bdf8"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#38bdf8" letter-spacing="2">30 DAYS · DAY 03</text>
  <text x="92" y="149" class="sans" font-size="59" font-weight="800" fill="url(#shine)">Postgres CDC Pipeline</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">Watermark, trigger and WAL change capture from PostgreSQL,</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">scored against ground truth</text>
  <rect x="96" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.45"/><text x="132" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Python</text><rect x="177" y="262" width="104" height="28" rx="14" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.45"/><text x="229" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">PostgreSQL</text><rect x="291" y="262" width="88" height="28" rx="14" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.45"/><text x="335" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">pgoutput</text>
  <g><path d="M858 62 v70 a40 12 0 0 0 80 0 v-70" fill="#161b22" stroke="#38bdf8" stroke-width="2"/><ellipse cx="898" cy="62" rx="40" ry="12" fill="#1b2430" stroke="#38bdf8" stroke-width="2"/><text x="898" y="110" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">shop</text><path d="M1150 62 v70 a40 12 0 0 0 80 0 v-70" fill="#161b22" stroke="#38bdf8" stroke-width="2"/><ellipse cx="1190" cy="62" rx="40" ry="12" fill="#1b2430" stroke="#38bdf8" stroke-width="2"/><text x="1190" y="110" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">rep</text><line x1="946" y1="100" x2="1142" y2="100" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2" class="flow"/><text x="1044" y="150" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">WAL · pgoutput</text><clipPath id="tape"><rect x="946" y="84" width="196" height="34"/></clipPath><g clip-path="url(#tape)"><g><rect x="900" y="88" width="26" height="26" rx="5" fill="#3fb950" fill-opacity=".9"/><text x="913" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">I</text><rect x="934" y="88" width="26" height="26" rx="5" fill="#38bdf8" fill-opacity=".9"/><text x="947" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">U</text><rect x="968" y="88" width="26" height="26" rx="5" fill="#38bdf8" fill-opacity=".9"/><text x="981" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">U</text><rect x="1002" y="88" width="26" height="26" rx="5" fill="#f85149" fill-opacity=".9"/><text x="1015" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">D</text><rect x="1036" y="88" width="26" height="26" rx="5" fill="#8b949e" fill-opacity=".9"/><text x="1049" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">C</text><rect x="1070" y="88" width="26" height="26" rx="5" fill="#3fb950" fill-opacity=".9"/><text x="1083" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">I</text><rect x="1104" y="88" width="26" height="26" rx="5" fill="#38bdf8" fill-opacity=".9"/><text x="1117" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">U</text><rect x="1138" y="88" width="26" height="26" rx="5" fill="#f85149" fill-opacity=".9"/><text x="1151" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">D</text><rect x="1172" y="88" width="26" height="26" rx="5" fill="#8b949e" fill-opacity=".9"/><text x="1185" y="106" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">C</text><animateTransform attributeName="transform" type="translate" values="0 0; 102 0" dur="2.4s" repeatCount="indefinite"/></g></g><g class="fade d3"><rect x="858" y="196" width="180" height="34" rx="9" fill="#161b22" stroke="#f85149" stroke-opacity=".6"/><text x="870" y="218" class="mono" font-size="13" fill="#e6edf3">watermark</text><text x="1026" y="218" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#f85149">✕ drifts</text></g><g class="fade d4"><rect x="1048" y="196" width="180" height="34" rx="9" fill="#161b22" stroke="#f85149" stroke-opacity=".6"/><text x="1060" y="218" class="mono" font-size="13" fill="#e6edf3">trigger_seq</text><text x="1216" y="218" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#f85149">✕ drifts</text></g><g class="fade d5"><rect x="858" y="240" width="180" height="34" rx="9" fill="#161b22" stroke="#3fb950" stroke-opacity=".6"/><text x="870" y="262" class="mono" font-size="13" fill="#e6edf3">trigger_queue</text><text x="1026" y="262" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#3fb950">✓ exact</text></g><g class="fade d6"><rect x="1048" y="240" width="180" height="34" rx="9" fill="#161b22" stroke="#3fb950" stroke-opacity=".6"/><text x="1060" y="262" class="mono" font-size="13" fill="#e6edf3">wal</text><text x="1216" y="262" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#3fb950">✓ exact</text></g></g>
</svg>
