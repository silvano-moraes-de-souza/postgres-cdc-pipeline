name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # Not a service container: services cannot pass -c wal_level=logical.
      - name: PostgreSQL 16 with logical WAL
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci \
            postgres:16-alpine -c wal_level=logical -c max_replication_slots=4
          for i in $(seq 30); do docker exec pg pg_isready -U ci && break; sleep 1; done
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose run --rm app
      - if: always()
        run: docker compose down -v
